<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Surprise 💖</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body { font-family: 'Poppins', sans-serif; }
.title { font-family: 'Great Vibes', cursive; }

/* floating hearts */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  animation: floatUp 6s linear infinite;
}
@keyframes floatUp {
  to { transform: translateY(-110vh); }
}
</style>
</head>

<body class="bg-gradient-to-br from-purple-500 via-pink-500 to-red-500 text-white overflow-hidden">

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="app" class="w-full h-screen flex items-center justify-center text-center">

<!-- Screen 1 -->
<div id="s1" class="space-y-6">
  <h1 class="title text-5xl">Dear Mam 💖</h1>
  <p>You are more than a teacher to me</p>
  <button onclick="start()" class="bg-white text-purple-600 px-6 py-3 rounded-full">
    Open Surprise 🎁
  </button>
</div>

<!-- Screen 2 -->
<div id="s2" class="hidden space-y-6">
  <h1 class="title text-4xl">A Special Message 💌</h1>
  <img src="photo1.jpg" class="w-64 mx-auto rounded-xl shadow-xl">
  <button onclick="next(3)" class="bg-white text-purple-600 px-4 py-2 rounded">
    Next
  </button>
</div>

<!-- Screen 3 -->
<div id="s3" class="hidden space-y-6">
  <h1 class="title text-4xl">From My Heart ❤️</h1>
  <p id="text" class="text-lg"></p>
  <button onclick="next(4)" class="bg-white text-purple-600 px-4 py-2 rounded">
    Final
  </button>
</div>

<!-- Screen 4 Final -->
<div id="s4" class="hidden space-y-6">
  <h1 class="title text-5xl">Thank You 💖</h1>
  <img src="photo2.jpg" class="w-64 mx-auto rounded-xl shadow-xl">
  <p>You are like my sister, guide, and inspiration 🌸</p>
  <button onclick="celebrate()" class="bg-white text-purple-600 px-6 py-2 rounded">
    Celebrate 🎉
  </button>

  <!-- Final Message -->
  <div id="finalMsg" class="hidden mt-4">
    <p class="text-lg">Wishing you happiness, success & endless smiles 😊</p>
  </div>
</div>

</div>

<script>
function show(id) {
  document.querySelectorAll('#app > div').forEach(el => el.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function start() {
  document.getElementById('music').play();
  show('s2');
}

function next(n) {
  show('s' + n);
  if(n === 3) typeText();
}

// typing message
let msg = "You are not just my mam, you are like my sister who guides me, supports me and inspires me every day. I am really lucky to have you in my life 💖";
function typeText() {
  let i = 0;
  let el = document.getElementById('text');
  el.innerHTML = "";
  function t() {
    if (i < msg.length) {
      el.innerHTML += msg[i++];
      setTimeout(t, 40);
    }
  }
  t();
}

// floating hearts
setInterval(() => {
  let h = document.createElement('div');
  h.className = 'heart';
  h.innerHTML = '💖';
  h.style.left = Math.random() * 100 + 'vw';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6000);
}, 800);

// celebrate
function celebrate() {
  document.getElementById('finalMsg').classList.remove('hidden');

  for (let i = 0; i < 80; i++) {
    let c = document.createElement('div');
    c.style.position = 'fixed';
    c.style.width = '8px';
    c.style.height = '8px';
    c.style.background = ['pink','white','yellow'][Math.floor(Math.random()*3)];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-10px';
    c.style.animation = 'fall 3s linear';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}
</script>

</body>
</html>
