<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Inspiration 💖</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #ff6ec4);
  background-size: 400% 400%;
  animation: gradientMove 10s ease infinite;
  color: white;
  overflow: hidden;
}
@keyframes gradientMove {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

/* screens */
.screen {
  position: absolute;
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  transition: 0.6s;
}

/* hidden */
.hidden {
  opacity: 0;
  transform: scale(0.9);
  pointer-events: none;
}

/* button */
.btn {
  background: white;
  color: black;
  padding: 10px 25px;
  border-radius: 50px;
  margin-top: 20px;
  transition: 0.3s;
}
.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px white;
}

/* image */
img {
  width: 250px;
  border-radius: 15px;
  margin-top: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transition: 0.4s;
}
img:hover {
  transform: scale(1.05);
}

/* hearts */
.heart {
  position: fixed;
  bottom: -20px;
  animation: floatUp 6s linear infinite;
}
@keyframes floatUp {
  to { transform: translateY(-110vh); }
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="music.mp3">
</audio>

<div id="app">

<!-- Screen 1 -->
<div id="s1" class="screen">
  <h1 class="text-4xl font-bold">For My Inspiration 💖</h1>
  <p class="mt-2">I made something special for you</p>
  <button onclick="next(2)" class="btn">Start</button>
</div>

<!-- Screen 2 -->
<div id="s2" class="screen hidden">
  <img src="photo1.jpg">
  <p class="mt-4 text-lg">"A teacher like you doesn’t just teach… you inspire."</p>
  <button onclick="next(3)" class="btn">Next</button>
</div>

<!-- Screen 3 -->
<div id="s3" class="screen hidden">
  <p id="typing" class="text-lg"></p>
  <button onclick="next(4)" class="btn">Next</button>
</div>

<!-- Screen 4 -->
<div id="s4" class="screen hidden">
  <img src="photo2.jpg">
  <p class="mt-4 text-lg">"Your words gave me confidence, your guidance gave me direction."</p>
  <button onclick="next(5)" class="btn">Final</button>
</div>

<!-- Screen 5 -->
<div id="s5" class="screen hidden">
  <h2 class="text-3xl">Thank You 💖</h2>
  <p class="mt-2">You are my inspiration and support 🌸</p>
  <button onclick="celebrate()" class="btn">Celebrate 🎉</button>

  <div id="finalMsg" class="hidden mt-4 text-lg">
    Wishing you happiness & success always ✨
  </div>
</div>

</div>

<script>
function next(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById('s'+n).classList.remove('hidden');

  if(n === 2){
    document.getElementById('music').play();
  }

  if(n === 3){
    typeText();
  }
}

// typing
let text = "You are not just my mam, you are like my sister who supports, guides, and believes in me 💖";
function typeText(){
  let i = 0;
  let el = document.getElementById('typing');
  el.innerHTML = "";
  function t(){
    if(i < text.length){
      el.innerHTML += text[i++];
      setTimeout(t,40);
    }
  }
  t();
}

// hearts
setInterval(()=>{
  let h=document.createElement('div');
  h.className='heart';
  h.innerHTML='💖';
  h.style.left=Math.random()*100+'vw';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},700);

// celebrate
function celebrate(){
  document.getElementById('finalMsg').classList.remove('hidden');

  for(let i=0;i<120;i++){
    let c=document.createElement('div');
    c.style.position='fixed';
    c.style.width='8px';
    c.style.height='8px';
    c.style.background=['pink','yellow','white'][Math.floor(Math.random()*3)];
    c.style.left=Math.random()*100+'vw';
    c.style.top='-10px';
    c.style.animation='fall 3s linear';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}
</script>

</body>
</html>
