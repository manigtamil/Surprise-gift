<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Surprise 💖</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- Premium Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body { 
  font-family: 'Montserrat', sans-serif;
  background: linear-gradient(to bottom right, #0f0c29, #302b63, #1a1a2e);
  color: white;
}

/* Elegant Title */
.title { 
  font-family: 'Playfair Display', serif;
  letter-spacing: 1px;
}

/* Glass card */
.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  transition: 0.5s;
}

/* Smooth transition */
.fade {
  animation: fade 0.8s ease;
}
@keyframes fade {
  from {opacity:0; transform:scale(0.95);}
  to {opacity:1; transform:scale(1);}
}

/* Button */
.btn {
  background: linear-gradient(45deg, #ffd700, #ffb300);
  color: black;
  padding: 10px 25px;
  border-radius: 50px;
  font-weight: 600;
  transition: 0.3s;
}
.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px gold;
}

/* Image */
img {
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  transition: 0.4s;
}
img:hover {
  transform: scale(1.05);
}

/* Hearts */
.heart {
  position: fixed;
  bottom: -20px;
  animation: floatUp 6s linear infinite;
}
@keyframes floatUp {
  to { transform: translateY(-110vh); }
}
</style>
</head>

<body class="overflow-hidden">

<audio id="music" loop>
  <source src="music.mp3">
</audio>

<div id="app" class="w-full h-screen flex items-center justify-center text-center">

<!-- Screen 1 -->
<div id="s1" class="card fade space-y-6">
  <h1 class="title text-5xl">Dear Mam 💖</h1>
  <p class="text-gray-300">You are more than a teacher to me</p>
  <button onclick="start()" class="btn">Open Surprise 🎁</button>
</div>

<!-- Screen 2 -->
<div id="s2" class="hidden card fade space-y-6">
  <h1 class="title text-4xl">A Special Message 💌</h1>
  <img src="photo1.jpg" class="w-64 mx-auto">
  <button onclick="next(3)" class="btn">Next</button>
</div>

<!-- Screen 3 -->
<div id="s3" class="hidden card fade space-y-6">
  <h1 class="title text-4xl">From My Heart ❤️</h1>
  <p id="text" class="text-lg text-gray-200"></p>
  <button onclick="next(4)" class="btn">Final</button>
</div>

<!-- Screen 4 -->
<div id="s4" class="hidden card fade space-y-6">
  <h1 class="title text-5xl">Thank You 💖</h1>
  <img src="photo2.jpg" class="w-64 mx-auto">
  <p class="text-gray-300">You are like my sister, guide, and inspiration 🌸</p>
  <button onclick="celebrate()" class="btn">Celebrate 🎉</button>

  <div id="finalMsg" class="hidden mt-4">
    <p class="text-lg text-yellow-300">Wishing you happiness, success & endless smiles 😊</p>
  </div>
</div>

</div>

<script>
function show(id) {
  document.querySelectorAll('#app > div').forEach(el => el.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function start() {
  document.getElementById('music').play();
  show('s2');
}

function next(n) {
  show('s' + n);
  if(n === 3) typeText();
}

// typing effect
let msg = "You are not just my mam, you are like my sister who guides me, supports me and inspires me every day. I am really lucky to have you in my life 💖";
function typeText() {
  let i = 0;
  let el = document.getElementById('text');
  el.innerHTML = "";
  function t() {
    if (i < msg.length) {
      el.innerHTML += msg[i++];
      setTimeout(t, 35);
    }
  }
  t();
}

// hearts
setInterval(() => {
  let h = document.createElement('div');
  h.className = 'heart';
  h.innerHTML = '💖';
  h.style.left = Math.random() * 100 + 'vw';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 6000);
}, 700);

// celebrate
function celebrate() {
  document.getElementById('finalMsg').classList.remove('hidden');

  for (let i = 0; i < 100; i++) {
    let c = document.createElement('div');
    c.style.position = 'fixed';
    c.style.width = '8px';
    c.style.height = '8px';
    c.style.background = ['gold','pink','white'][Math.floor(Math.random()*3)];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-10px';
    c.style.animation = 'fall 3s linear';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}
</script>

</body>
</html>
